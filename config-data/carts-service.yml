server:
  port: 8083

spring:
  application:
    name: carts-service
  datasource:
    username: root
    password: "" # Contraseña vacía
    url: jdbc:mysql://localhost:3306/carts_service
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    # Fast fetch interval for development/testing
    registry-fetch-interval-seconds: 5